<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacroTracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-16">

  <!-- BARRA TARGET FISSA IN ALTO -->
  <div class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-gray-200 z-50 p-4 shadow-sm">
    <div class="max-w-2xl mx-auto">
      <div class="flex justify-between items-center mb-2">
        <h1 class="text-xl font-bold tracking-tight">Oggi • 2000 kcal</h1>
        <button onclick="resetDay()" class="text-xs text-red-500 hover:text-red-700 font-medium">Azzera</button>
      </div>

      <!-- Barre di avanzamento Macronutrienti -->
      <div class="grid grid-cols-4 gap-2 text-center text-xs">
        <!-- Calorie -->
        <div class="bg-gray-50 p-2 rounded-lg border border-gray-200">
          <div class="text-gray-500 font-medium">Calorie</div>
          <div class="font-bold text-sm" id="cal-count">0 / 2000</div>
          <div class="w-full bg-gray-200 rounded-full h-1.5 mt-1 overflow-hidden">
            <div id="bar-cal" class="bg-black h-1.5 rounded-full" style="width: 0%"></div>
          </div>
        </div>
        <!-- Proteine -->
        <div class="bg-gray-50 p-2 rounded-lg border border-gray-200">
          <div class="text-blue-600 font-semibold">Proteine</div>
          <div class="font-bold text-sm" id="p-count">0 / 120g</div>
          <div class="w-full bg-gray-200 rounded-full h-1.5 mt-1 overflow-hidden">
            <div id="bar-p" class="bg-blue-600 h-1.5 rounded-full" style="width: 0%"></div>
          </div>
        </div>
        <!-- Carboidrati -->
        <div class="bg-gray-50 p-2 rounded-lg border border-gray-200">
          <div class="text-amber-600 font-semibold">Carboidrati</div>
          <div class="font-bold text-sm" id="c-count">0 / 245g</div>
          <div class="w-full bg-gray-200 rounded-full h-1.5 mt-1 overflow-hidden">
            <div id="bar-c" class="bg-amber-500 h-1.5 rounded-full" style="width: 0%"></div>
          </div>
        </div>
        <!-- Grassi -->
        <div class="bg-gray-50 p-2 rounded-lg border border-gray-200">
          <div class="text-emerald-600 font-semibold">Grassi</div>
          <div class="font-bold text-sm" id="f-count">0 / 55g</div>
          <div class="w-full bg-gray-200 rounded-full h-1.5 mt-1 overflow-hidden">
            <div id="bar-f" class="bg-emerald-500 h-1.5 rounded-full" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="max-w-2xl mx-auto p-4 space-y-4 mt-2">

    <!-- 1. COLAZIONE -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-lg flex items-center gap-2">🥣 Colazione</h2>
        <span class="text-xs bg-gray-100 text-gray-700 px-2.5 py-1 rounded-full font-medium" id="colazione-macro">0 kcal</span>
      </div>
      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Scegli la tua opzione</label>
      <select id="sel-colazione" onchange="updateAll()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black">
        <option value="none">-- Seleziona Colazione --</option>
        <option value="1">Salmone: 50g Pane + 50g Salmone + 1/4 Avocado + 200ml Latte 0%</option>
        <option value="2">Philadelphia: 50g Pane + 30g Philadelphia + 1 Uovo + 100ml Albume</option>
        <option value="3">Uovo: 50g Pane + 1 Uovo + 100ml Albume + 1/4 Avocado</option>
        <option value="4">Avena: 200g Yogurt greco 0% + 45g Avena + 10g Miele + 10g Noci</option>
      </select>
    </div>

    <!-- 2. PRANZO -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-lg flex items-center gap-2">🍝 Pranzo</h2>
        <span class="text-xs bg-gray-100 text-gray-700 px-2.5 py-1 rounded-full font-medium" id="pranzo-macro">0 kcal</span>
      </div>

      <!-- Switch Modalità Pranzo -->
      <div class="flex bg-gray-100 p-1 rounded-xl mb-3 text-xs font-semibold">
        <button id="btn-pranzo-classico" onclick="switchPranzoMode('classico')" class="flex-1 py-1.5 rounded-lg bg-white shadow-sm">Pasta</button>
        <button id="btn-pranzo-legumi" onclick="switchPranzoMode('legumi')" class="flex-1 py-1.5 rounded-lg text-gray-500">Legumi</button>
      </div>

      <!-- Pranzo: Componibile Classico -->
      <div id="pranzo-mode-classico" class="space-y-3">
        <!-- 1. PASTA E OLIO SOPRA LA PROTEINA -->
        <div class="grid grid-cols-2 gap-2 pb-1">
          <label class="flex items-center gap-2 p-2.5 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer">
            <input type="checkbox" id="chk-pranzo-pasta" checked onchange="updateAll()" class="w-4 h-4 rounded text-black focus:ring-black">
            <span class="text-xs font-medium text-gray-700">🍝 120g Pasta</span>
          </label>
          <label class="flex items-center gap-2 p-2.5 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer">
            <input type="checkbox" id="chk-pranzo-olio" checked onchange="updateAll()" class="w-4 h-4 rounded text-black focus:ring-black">
            <span class="text-xs font-medium text-gray-700">🫒 10g Olio EVO</span>
          </label>
        </div>

        <!-- 2. SCELTA PROTEICA SOTTO -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Fonte Proteica</label>
          <select id="sel-pranzo-prot" onchange="updateAll()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black">
            <option value="none">-- Seleziona proteina --</option>
          </select>
        </div>
      </div>

      <!-- Pranzo: Piatto Unico Legumi -->
      <div id="pranzo-mode-legumi" class="hidden space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Legumi</label>
          <select id="sel-pranzo-legumi" onchange="updateAll()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black">
            <option value="none">-- Seleziona legume --</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 3. MERENDA -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-bold text-lg flex items-center gap-2">🍌 Merenda</h2>
        <span class="text-xs bg-gray-100 text-gray-700 px-2.5 py-1 rounded-full font-medium" id="merenda-macro">0 kcal</span>
      </div>
      <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
        <div class="text-xs">
          <p class="font-bold text-gray-800">50g Pane + 15g Miele + 1 Banana</p>
          <p class="text-gray-500 mt-0.5">270 kcal • 5.5g P • 60g C • 2g G</p>
        </div>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="chk-merenda" onchange="updateAll()" class="w-5 h-5 rounded text-black focus:ring-black">
          <span class="text-xs font-bold text-gray-800">Mangiata</span>
        </label>
      </div>
    </div>

    <!-- 4. CENA -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-lg flex items-center gap-2">🍽️ Cena</h2>
        <span class="text-xs bg-gray-100 text-gray-700 px-2.5 py-1 rounded-full font-medium" id="cena-macro">0 kcal</span>
      </div>

      <!-- Switch Modalità Cena -->
      <div class="flex bg-gray-100 p-1 rounded-xl mb-3 text-xs font-semibold">
        <button id="btn-cena-classico" onclick="switchCenaMode('classico')" class="flex-1 py-1.5 rounded-lg bg-white shadow-sm">Proteina</button>
        <button id="btn-cena-legumi" onclick="switchCenaMode('legumi')" class="flex-1 py-1.5 rounded-lg text-gray-500">Legumi</button>
      </div>

      <!-- Cena: Componibile Classico -->
      <div id="cena-mode-classico" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Fonte Proteica</label>
          <select id="sel-cena-prot" onchange="updateAll()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black">
            <option value="none">-- Seleziona proteina --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Fonte di Carboidrati</label>
          <select id="sel-cena-carb" onchange="updateAll()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black">
            <option value="none">-- Seleziona carboidrato --</option>
            <option value="pane">100g Pane</option>
            <option value="patate">250g Patate</option>
            <option value="riso">65g Riso</option>
          </select>
        </div>

        <!-- Olio Cena indipendente -->
        <label class="flex items-center gap-2 p-2.5 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer">
          <input type="checkbox" id="chk-cena-olio" checked onchange="updateAll()" class="w-4 h-4 rounded text-black focus:ring-black">
          <span class="text-xs font-medium text-gray-700">🫒 10g Olio EVO</span>
        </label>
      </div>

      <!-- Cena: Piatto Unico Legumi -->
      <div id="cena-mode-legumi" class="hidden space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Legumi</label>
          <select id="sel-cena-legumi" onchange="updateAll()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black">
            <option value="none">-- Seleziona legume --</option>
          </select>
        </div>
      </div>
    </div>

  </main>

  <script>
    // DATABASE PROTEINE
    const PROTEINE = [
      { id: "macinato", name: "150g Macinato magro / Scottona", p: 31, c: 0, f: 7, kcal: 190 },
      { id: "pollo", name: "140g Petto di pollo", p: 32, c: 0, f: 1.5, kcal: 145 },
      { id: "tacchino", name: "140g Petto di tacchino", p: 32, c: 0, f: 1.5, kcal: 145 },
      { id: "bresaola", name: "110g Bresaola / Fesa di tacchino", p: 34, c: 1, f: 2, kcal: 160 },
      { id: "arista", name: "140g Arista di maiale magra", p: 31, c: 0, f: 4, kcal: 160 },
      { id: "tonno", name: "130g Tonno al naturale sgocc.", p: 32, c: 0, f: 1, kcal: 140 },
      { id: "pesce_bianco", name: "180g Merluzzo / Nasello / Platessa", p: 31, c: 0, f: 1, kcal: 140 },
      { id: "persico", name: "160g Filetto di persico", p: 30, c: 0, f: 2, kcal: 140 },
      { id: "salmone", name: "150g Salmone fresco", p: 30, c: 0, f: 18, kcal: 285 },
      { id: "sgombro", name: "140g Sgombro al naturale sgocc.", p: 29, c: 0, f: 10, kcal: 210 },
      { id: "gamberi", name: "160g Gamberi / Mazzancolle sgusc.", p: 32, c: 1, f: 1, kcal: 140 },
      { id: "molluschi", name: "180g Anelli di totano / seppia", p: 30, c: 2, f: 2, kcal: 145 },
      { id: "scatola_pollo", name: "150g Pollo in scatola naturale sgocc.", p: 31, c: 0, f: 1.5, kcal: 140 },
      { id: "uova", name: "2 Uova intere + 150g Albume", p: 28, c: 1.5, f: 10, kcal: 210 },
      { id: "fiocchi", name: "250g Fiocchi di latte magri", p: 28, c: 6, f: 4, kcal: 175 },
      { id: "ricotta", name: "200g Ricotta vaccina", p: 18, c: 7, f: 18, kcal: 260 }
    ];

    // DATABASE LEGUMI (Pasti Unici)
    const LEGUMI = [
      { id: "ceci_barattolo", name: "350g Ceci barattolo + 30g Pane + Olio", p: 27, c: 75, f: 18, kcal: 580 },
      { id: "lenticchie_barattolo", name: "350g Lenticchie barattolo + 30g Pane + Olio", p: 29, c: 70, f: 16, kcal: 560 },
      { id: "ceci_secchi", name: "110g Ceci secchi + 30g Pane + Olio", p: 26, c: 78, f: 18, kcal: 590 },
      { id: "lenticchie_secche", name: "110g Lenticchie secche + 30g Pane + Olio", p: 30, c: 72, f: 15, kcal: 570 }
    ];

    // COLAZIONI
    const COLAZIONI = {
      "1": { p: 21, c: 36, f: 16, kcal: 390 },
      "2": { p: 24, c: 27, f: 14, kcal: 335 },
      "3": { p: 23, c: 29, f: 12, kcal: 315 },
      "4": { p: 28, c: 47, f: 10, kcal: 380 }
    };

    // MERENDA
    const MERENDA = { p: 5.5, c: 60, f: 2, kcal: 270 };

    // COMPONENTI FISSI AGGIORNATI
    // 120g di pasta: 426 kcal, 14.4g P, 87.6g C, 1.8g F
    const PASTA_PRANZO = { p: 14.4, c: 87.6, f: 1.8, kcal: 426 };
    const OLIO_EVO = { p: 0, c: 0, f: 10, kcal: 90 };

    let state = {
      pranzoMode: 'classico',
      cenaMode: 'classico'
    };

    function initSelects() {
      const pSel1 = document.getElementById('sel-pranzo-prot');
      const pSel2 = document.getElementById('sel-cena-prot');
      PROTEINE.forEach(item => {
        pSel1.innerHTML += `<option value="${item.id}">${item.name}</option>`;
        pSel2.innerHTML += `<option value="${item.id}">${item.name}</option>`;
      });

      const lSel1 = document.getElementById('sel-pranzo-legumi');
      const lSel2 = document.getElementById('sel-cena-legumi');
      LEGUMI.forEach(item => {
        lSel1.innerHTML += `<option value="${item.id}">${item.name}</option>`;
        lSel2.innerHTML += `<option value="${item.id}">${item.name}</option>`;
      });
    }

    function switchPranzoMode(mode) {
      state.pranzoMode = mode;
      document.getElementById('pranzo-mode-classico').classList.toggle('hidden', mode !== 'classico');
      document.getElementById('pranzo-mode-legumi').classList.toggle('hidden', mode !== 'legumi');
      document.getElementById('btn-pranzo-classico').className = mode === 'classico' ? 'flex-1 py-1.5 rounded-lg bg-white shadow-sm' : 'flex-1 py-1.5 rounded-lg text-gray-500';
      document.getElementById('btn-pranzo-legumi').className = mode === 'legumi' ? 'flex-1 py-1.5 rounded-lg bg-white shadow-sm' : 'flex-1 py-1.5 rounded-lg text-gray-500';

      const chkPasta = document.getElementById('chk-pranzo-pasta');
      if (mode === 'legumi') {
        chkPasta.checked = false;
        chkPasta.disabled = true;
      } else {
        chkPasta.disabled = false;
        chkPasta.checked = true;
      }

      updateAll();
    }

    function switchCenaMode(mode) {
      state.cenaMode = mode;
      document.getElementById('cena-mode-classico').classList.toggle('hidden', mode !== 'classico');
      document.getElementById('cena-mode-legumi').classList.toggle('hidden', mode !== 'legumi');
      document.getElementById('btn-cena-classico').className = mode === 'classico' ? 'flex-1 py-1.5 rounded-lg bg-white shadow-sm' : 'flex-1 py-1.5 rounded-lg text-gray-500';
      document.getElementById('btn-cena-legumi').className = mode === 'legumi' ? 'flex-1 py-1.5 rounded-lg bg-white shadow-sm' : 'flex-1 py-1.5 rounded-lg text-gray-500';
      updateAll();
    }

    function updateAll() {
      let tot = { kcal: 0, p: 0, c: 0, f: 0 };

      // 1. COLAZIONE
      const cVal = document.getElementById('sel-colazione').value;
      if (cVal !== 'none' && COLAZIONI[cVal]) {
        const col = COLAZIONI[cVal];
        tot.kcal += col.kcal; tot.p += col.p; tot.c += col.c; tot.f += col.f;
        document.getElementById('colazione-macro').innerText = `${col.kcal} kcal • ${col.p}P ${col.c}C ${col.f}G`;
      } else {
        document.getElementById('colazione-macro').innerText = `0 kcal`;
      }

      // 2. PRANZO
      let pMeal = { kcal: 0, p: 0, c: 0, f: 0 };
      if (state.pranzoMode === 'classico') {
        // Pasta 120g
        if (document.getElementById('chk-pranzo-pasta').checked) {
          pMeal.kcal += PASTA_PRANZO.kcal; pMeal.p += PASTA_PRANZO.p; pMeal.c += PASTA_PRANZO.c; pMeal.f += PASTA_PRANZO.f;
        }
        // Olio EVO
        if (document.getElementById('chk-pranzo-olio').checked) {
          pMeal.kcal += OLIO_EVO.kcal; pMeal.p += OLIO_EVO.p; pMeal.c += OLIO_EVO.c; pMeal.f += OLIO_EVO.f;
        }
        // Proteina
        const protId = document.getElementById('sel-pranzo-prot').value;
        if (protId !== 'none') {
          const prot = PROTEINE.find(x => x.id === protId);
          pMeal.kcal += prot.kcal; pMeal.p += prot.p; pMeal.c += prot.c; pMeal.f += prot.f;
        }
      } else {
        const legId = document.getElementById('sel-pranzo-legumi').value;
        if (legId !== 'none') {
          const leg = LEGUMI.find(x => x.id === legId);
          pMeal.kcal += leg.kcal; pMeal.p += leg.p; pMeal.c += leg.c; pMeal.f += leg.f;
        }
      }
      tot.kcal += pMeal.kcal; tot.p += pMeal.p; tot.c += pMeal.c; tot.f += pMeal.f;
      document.getElementById('pranzo-macro').innerText = `${Math.round(pMeal.kcal)} kcal • ${Math.round(pMeal.p)}P ${Math.round(pMeal.c)}C ${Math.round(pMeal.f)}G`;

      // 3. MERENDA
      if (document.getElementById('chk-merenda').checked) {
        tot.kcal += MERENDA.kcal; tot.p += MERENDA.p; tot.c += MERENDA.c; tot.f += MERENDA.f;
        document.getElementById('merenda-macro').innerText = `${MERENDA.kcal} kcal • ${MERENDA.p}P ${MERENDA.c}C ${MERENDA.f}G`;
      } else {
        document.getElementById('merenda-macro').innerText = `0 kcal`;
      }

      // 4. CENA
      let cMeal = { kcal: 0, p: 0, c: 0, f: 0 };
      if (state.cenaMode === 'classico') {
        const protId = document.getElementById('sel-cena-prot').value;
        if (protId !== 'none') {
          const prot = PROTEINE.find(x => x.id === protId);
          cMeal.kcal += prot.kcal; cMeal.p += prot.p; cMeal.c += prot.c; cMeal.f += prot.f;
        }
        const carbId = document.getElementById('sel-cena-carb').value;
        // 100g Pane: 270 kcal, 8.5g P, 51g C, 1.5g F
        if (carbId === 'pane')   { cMeal.kcal += 270; cMeal.p += 8.5; cMeal.c += 51; cMeal.f += 1.5; }
        if (carbId === 'patate') { cMeal.kcal += 200; cMeal.p += 4.5; cMeal.c += 43; cMeal.f += 0.5; }
        if (carbId === 'riso')   { cMeal.kcal += 230; cMeal.p += 5;   cMeal.c += 51; cMeal.f += 0.5; }
        if (document.getElementById('chk-cena-olio').checked) {
          cMeal.kcal += OLIO_EVO.kcal; cMeal.p += OLIO_EVO.p; cMeal.c += OLIO_EVO.c; cMeal.f += OLIO_EVO.f;
        }
      } else {
        const legId = document.getElementById('sel-cena-legumi').value;
        if (legId !== 'none') {
          const leg = LEGUMI.find(x => x.id === legId);
          cMeal.kcal += leg.kcal; cMeal.p += leg.p; cMeal.c += leg.c; cMeal.f += leg.f;
        }
      }
      tot.kcal += cMeal.kcal; tot.p += cMeal.p; tot.c += cMeal.c; tot.f += cMeal.f;
      document.getElementById('cena-macro').innerText = `${Math.round(cMeal.kcal)} kcal • ${Math.round(cMeal.p)}P ${Math.round(cMeal.c)}C ${Math.round(cMeal.f)}G`;

      // BARRE PROGRESSO IN ALTO
      document.getElementById('cal-count').innerText = `${Math.round(tot.kcal)} / 2000`;
      document.getElementById('p-count').innerText = `${Math.round(tot.p)} / 120g`;
      document.getElementById('c-count').innerText = `${Math.round(tot.c)} / 245g`;
      document.getElementById('f-count').innerText = `${Math.round(tot.f)} / 55g`;

      document.getElementById('bar-cal').style.width = `${Math.min((tot.kcal / 2000) * 100, 100)}%`;
      document.getElementById('bar-p').style.width = `${Math.min((tot.p / 120) * 100, 100)}%`;
      document.getElementById('bar-c').style.width = `${Math.min((tot.c / 245) * 100, 100)}%`;
      document.getElementById('bar-f').style.width = `${Math.min((tot.f / 55) * 100, 100)}%`;

      saveState();
    }

    function saveState() {
      const data = {
        colazione: document.getElementById('sel-colazione').value,
        pranzoMode: state.pranzoMode,
        pranzoProt: document.getElementById('sel-pranzo-prot').value,
        pranzoPasta: document.getElementById('chk-pranzo-pasta').checked,
        pranzoOlio: document.getElementById('chk-pranzo-olio').checked,
        pranzoLeg: document.getElementById('sel-pranzo-legumi').value,
        merenda: document.getElementById('chk-merenda').checked,
        cenaMode: state.cenaMode,
        cenaProt: document.getElementById('sel-cena-prot').value,
        cenaCarb: document.getElementById('sel-cena-carb').value,
        cenaOlio: document.getElementById('chk-cena-olio').checked,
        cenaLeg: document.getElementById('sel-cena-legumi').value
      };
      localStorage.setItem('myDietLog', JSON.stringify(data));
    }

    function loadState() {
      const saved = localStorage.getItem('myDietLog');
      if (saved) {
        const d = JSON.parse(saved);
        document.getElementById('sel-colazione').value = d.colazione || 'none';
        if (d.pranzoMode) switchPranzoMode(d.pranzoMode);
        document.getElementById('sel-pranzo-prot').value = d.pranzoProt || 'none';
        if (d.pranzoPasta !== undefined) document.getElementById('chk-pranzo-pasta').checked = d.pranzoPasta;
        if (d.pranzoOlio !== undefined) document.getElementById('chk-pranzo-olio').checked = d.pranzoOlio;
        document.getElementById('sel-pranzo-legumi').value = d.pranzoLeg || 'none';
        document.getElementById('chk-merenda').checked = !!d.merenda;
        if (d.cenaMode) switchCenaMode(d.cenaMode);
        document.getElementById('sel-cena-prot').value = d.cenaProt || 'none';
        document.getElementById('sel-cena-carb').value = d.cenaCarb || 'none';
        if (d.cenaOlio !== undefined) document.getElementById('chk-cena-olio').checked = d.cenaOlio;
        document.getElementById('sel-cena-legumi').value = d.cenaLeg || 'none';
      }
      updateAll();
    }

    function resetDay() {
      if (confirm('Vuoi azzerare tutte le selezioni del giorno?')) {
        localStorage.removeItem('myDietLog');
        location.reload();
      }
    }

    initSelects();
    loadState();
  </script>
</body>
</html>
